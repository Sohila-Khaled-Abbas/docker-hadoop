# ==============================================================================
# 📥 Apache Flume — Agent Configuration: Spool Directory -> HDFS
# ==============================================================================

# Define Agent Components
agent.sources = spoolSource
agent.channels = memChannel
agent.sinks = hdfsSink

# Configure Spooling Directory Source
agent.sources.spoolSource.type = spooldir
agent.sources.spoolSource.spoolDir = /data/flume_spool
agent.sources.spoolSource.fileHeader = true
agent.sources.spoolSource.basenameHeader = true

# Configure Memory Channel
agent.channels.memChannel.type = memory
agent.channels.memChannel.capacity = 10000
agent.channels.memChannel.transactionCapacity = 1000

# Configure HDFS Sink with Rolling Policy
agent.sinks.hdfsSink.type = hdfs
agent.sinks.hdfsSink.hdfs.path = hdfs://hadoop:9000/data/flume_events/%Y-%m-%d
agent.sinks.hdfsSink.hdfs.filePrefix = events-
agent.sinks.hdfsSink.hdfs.rollInterval = 300
agent.sinks.hdfsSink.hdfs.rollSize = 67108864
agent.sinks.hdfsSink.hdfs.rollCount = 0
agent.sinks.hdfsSink.hdfs.fileType = DataStream
agent.sinks.hdfsSink.hdfs.writeFormat = Text
agent.sinks.hdfsSink.hdfs.useLocalTimeStamp = true

# Bind Source and Sink to Channel
agent.sources.spoolSource.channels = memChannel
agent.sinks.hdfsSink.channel = memChannel
