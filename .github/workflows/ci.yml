name: 🐘 Docker Build & Test CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: 🧪 Build, Cluster Health & MapReduce Validation
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v7

      - name: 🔑 Ensure scripts are executable
        run: |
          chmod +x scripts/*.sh examples/*/*.sh examples/*/*.py

      - name: 🐳 Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔨 Build Docker Image
        run: |
          docker build -t hadoop-cluster:3.1.2 -f Dockerfile .

      - name: 🚀 Launch Hadoop Cluster with Docker Compose
        run: |
          docker compose up -d

      - name: ⏳ Wait for Cluster Health Check (Healthy State)
        run: |
          echo "Waiting for Hadoop cluster to achieve healthy status..."
          TIMEOUT=120
          ELAPSED=0
          until [ "$(docker inspect -f '{{.State.Health.Status}}' hadoop-master 2>/dev/null)" = "healthy" ]; do
            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "❌ Cluster failed to reach healthy state within ${TIMEOUT}s"
              docker compose logs hadoop --tail 100
              exit 1
            fi
            echo "Waiting... (${ELAPSED}s / ${TIMEOUT}s) - Current status: $(docker inspect -f '{{.State.Health.Status}}' hadoop-master 2>/dev/null)"
            sleep 5
            ELAPSED=$((ELAPSED + 5))
          done
          echo "✅ Cluster is healthy!"

      - name: 🩺 Verify Running Java Daemons
        run: |
          echo "Checking JPS daemons:"
          docker compose exec -T hadoop jps

      - name: 🧪 Execute Built-in HDFS & Pi MapReduce Tests
        run: |
          docker compose exec -T hadoop /test-cluster.sh

      - name: 🐍 Execute Python Hadoop Streaming WordCount Test
        run: |
          bash examples/mapreduce-python/run.sh

      - name: ☕ Compile & Execute Java MapReduce WordCount Test
        run: |
          bash examples/mapreduce-java/compile-and-run.sh

      - name: 🧹 Teardown Cluster
        if: always()
        run: |
          docker compose down -v
