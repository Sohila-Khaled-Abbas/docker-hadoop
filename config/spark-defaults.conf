# ==============================================================================
# Apache Spark Configuration for Unified Big Data Engineering Cluster
# ==============================================================================

# Master & Cluster Manager
spark.master                         spark://spark-master:7077

# Distributed HDFS Storage Layer
spark.hadoop.fs.defaultFS             hdfs://hadoop:9000
spark.sql.warehouse.dir              hdfs://hadoop:9000/user/hive/warehouse

# Spark Event Logging & History Server
spark.eventLog.enabled               true
spark.eventLog.dir                   hdfs://hadoop:9000/spark-logs
spark.history.fs.logDirectory        hdfs://hadoop:9000/spark-logs
spark.history.fs.update.interval     10s
spark.history.ui.port                18080

# Performance & Serialization
spark.serializer                     org.apache.spark.serializer.KryoSerializer
spark.driver.memory                  1024m
spark.executor.memory                1024m
spark.sql.shuffle.partitions         4

# YARN Integration Support
spark.yarn.historyServer.address     hadoop:19888
